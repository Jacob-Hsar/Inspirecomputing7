<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House of J&S — Year 7 Computing Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227;--gold-2:#f2d477;--gold-3:#fff8dc;--gold-soft:#fdf6df;
  --gold-deep:#7a5a05;--ink:#1a1712;--ink-2:#3d362a;--muted:#7a7264;
  --muted-2:#a39a86;--paper:#fdfaf3;--paper-2:#fffdf8;--line:#ece2c6;
  --line-2:#f5eed9;--dark:#1d1810;--good:#137333;--good-bg:#eefaf0;
  --bad:#b3261e;--bad-bg:#fdeeed;
  --shadow-sm:0 1px 2px rgba(75,55,10,.04),0 4px 12px rgba(75,55,10,.05);
  --shadow-md:0 4px 12px rgba(75,55,10,.06),0 18px 40px rgba(75,55,10,.08);
  --shadow-lg:0 20px 60px rgba(75,55,10,.14),0 4px 12px rgba(75,55,10,.06);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
::selection{background:var(--gold-2);color:#3d2c00}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#f7f0dc}
::-webkit-scrollbar-thumb{background:#e2d4a5;border-radius:99px;border:3px solid #f7f0dc}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
body{
  margin:0;font-family:var(--font-body);
  background:
    radial-gradient(1200px 600px at 15% -10%,#fff8e0 0%,transparent 60%),
    radial-gradient(900px 500px at 100% 0%,#fef6e0 0%,transparent 50%),
    linear-gradient(180deg,#fffdf8 0%,#fdf8ec 100%);
  background-attachment:fixed;color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.55;
}
button,input,select,textarea{font:inherit;color:inherit;font-family:inherit}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;color:var(--ink);line-height:1.15}
h2{font-size:clamp(22px,2.4vw,30px);margin:0 0 16px}
h3{font-size:19px;margin:0 0 8px}
h4{font-size:16px;margin:20px 0 10px}
p{margin:0 0 12px}
a{color:var(--gold-deep)}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,253,247,.85);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(75,55,10,.04);
}
.nav{max-width:1500px;margin:auto;display:flex;align-items:center;gap:10px;padding:12px 22px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand img{
  width:52px;height:52px;object-fit:contain;border-radius:14px;
  border:1px solid #ecdfab;background:linear-gradient(135deg,#fffdf6,#fff5d0);
  padding:4px;box-shadow:0 4px 12px rgba(201,162,39,.18);
}
.brand b{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink);display:block}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.nav button{
  border:1px solid transparent;background:transparent;padding:10px 16px;
  border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-2);transition:all .2s ease;
}
.nav button:hover{background:var(--gold-soft);border-color:var(--line);color:var(--ink);transform:translateY(-1px)}
.gold,.gold-btn{
  background:linear-gradient(135deg,#d4ad34 0%,#c9a227 45%,#a97f14 100%)!important;
  color:#fff!important;border:0!important;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
  box-shadow:0 8px 20px -6px rgba(201,162,39,.55),inset 0 1px 0 rgba(255,255,255,.35)!important;
  transition:transform .15s ease,box-shadow .2s ease,filter .2s ease;
}
.gold:hover,.gold-btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px -6px rgba(201,162,39,.65);filter:brightness(1.04)}

/* ============ HERO ============ */
.hero{max-width:1500px;margin:30px auto 8px;padding:0 22px}
.hero-card{
  background:
    radial-gradient(700px 340px at 88% -10%,rgba(242,212,119,.20),transparent 60%),
    radial-gradient(500px 300px at 0% 100%,rgba(242,212,119,.08),transparent 60%),
    linear-gradient(135deg,#191510 0%,#2c2416 55%,#3d3018 100%);
  color:#fff;border-radius:32px;padding:52px 48px;box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;border:1px solid rgba(242,212,119,.14);
}
.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero-card:before{width:520px;height:520px;border:1px solid rgba(242,212,119,.22);right:-200px;top:-200px}
.hero-card:after{width:340px;height:340px;border:1px solid rgba(242,212,119,.12);right:-120px;top:-120px}
.kicker{
  display:inline-block;color:var(--gold-2);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(242,212,119,.1);
  border:1px solid rgba(242,212,119,.24);
}
.hero-card h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(36px,5.2vw,64px);line-height:1.02;margin:16px 0 18px;letter-spacing:-.022em;
  max-width:900px;
  background:linear-gradient(180deg,#fff 0%,#f4e9c6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-card p{max-width:850px;color:#e8e2d2;line-height:1.75;font-size:15px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.stat{
  padding:14px 18px;border:1px solid rgba(255,255,255,.14);border-radius:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  backdrop-filter:blur(8px);transition:border-color .2s ease,transform .2s ease;
}
.stat:hover{border-color:rgba(242,212,119,.4);transform:translateY(-2px)}
.stat b{color:var(--gold-2);font-family:var(--font-display);font-size:18px}
.stat small{color:#cfc7b3;font-size:11.5px}

/* ============ LAYOUT ============ */
.layout{max-width:1500px;margin:0 auto;padding:16px 22px 64px;display:grid;grid-template-columns:290px 1fr;gap:24px}
.side{
  position:sticky;top:82px;align-self:start;background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:18px;box-shadow:var(--shadow-md);
  max-height:calc(100vh - 100px);overflow:auto;
}
.side h3{margin:4px 4px 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700}
.side button{
  width:100%;text-align:left;margin:4px 0;padding:12px 14px;border:1px solid transparent;
  background:#fff;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:13.5px;transition:all .18s ease;
}
.side button:hover{background:var(--gold-soft);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.side button.gold{color:#fff!important;text-align:center;font-weight:700}
.side hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.side b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 4px 8px}
.content{min-width:0}

/* ============ PANELS ============ */
.panel{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;
  box-shadow:var(--shadow-md);margin-bottom:22px;transition:box-shadow .25s ease;
}
.panel h2{margin-top:0}
.muted{color:var(--muted);font-size:14px;line-height:1.65}
.note{
  padding:16px 18px;border-left:4px solid var(--gold);background:linear-gradient(100deg,#fffaf0,#fffdf8);
  border-radius:12px;color:#5b4b1d;line-height:1.7;font-size:14px;
}
.note a{color:var(--gold-deep);font-weight:600;word-break:break-all}

/* ============ UNIT GRID ============ */
.unit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.unit-card{
  border:1px solid var(--line);border-radius:20px;padding:22px;
  background:linear-gradient(180deg,#fff 0%,#fffaf0 100%);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.unit-card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-2) 40%,transparent 100%);opacity:.9}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#e5d49a}
.unit-card h3{font-size:17px;margin:6px 0 10px;line-height:1.35;color:var(--ink)}
.unit-card p{font-size:12.5px;color:var(--muted);flex-grow:1;margin-bottom:16px;min-height:44px}
.unit-card button{width:100%;font-size:13px;padding:11px 14px;border-radius:11px;font-weight:700}
.unit-card button + button{margin-top:8px}
.ghost{
  border:1px solid var(--line)!important;background:#fff!important;color:var(--ink-2)!important;
  box-shadow:none!important;font-weight:600!important;
}
.ghost:hover{background:var(--gold-soft)!important;border-color:var(--gold)!important;color:var(--ink)!important}

/* ============ BADGES ============ */
.badge{
  display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;
  background:#fff6ce;color:#725600;border:1px solid #ead18a;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--font-body);
}

/* ============ LESSONS ============ */
.lesson-block{
  border:1px solid var(--line);border-radius:20px;margin:14px 0;overflow:hidden;background:#fff;
  box-shadow:var(--shadow-sm);transition:box-shadow .2s ease,border-color .2s ease;
}
.lesson-block:hover{box-shadow:var(--shadow-md);border-color:#e8d9a4}
.lesson-head{
  padding:18px 22px;background:linear-gradient(100deg,#fff6ce 0%,#fffdf3 60%,#fff 100%);
  display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.lesson-head h3{margin:6px 0 0;font-size:17px}
.lesson-head button{
  border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;
  font-weight:700;font-size:12.5px;color:var(--ink-2);transition:all .18s ease;
}
.lesson-head button:hover{background:var(--gold-soft);border-color:var(--gold)}
.lesson-body{padding:22px 24px 26px}

/* ============ DEFINITION CARDS ============ */
.definition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.definition-card{
  border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;
  background:linear-gradient(180deg,#fffdf8,#fffaf0);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.definition-card:hover{border-color:#e5d49a;box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.definition-term{
  font-family:var(--font-display);font-weight:700;color:var(--gold-deep);
  font-size:15.5px;margin-bottom:8px;letter-spacing:-.005em;line-height:1.3;
  display:flex;align-items:baseline;gap:6px;
}
.definition-term:after{content:"—";color:var(--gold);font-weight:400;font-size:14px;opacity:.6}
.definition-card p{margin:0;line-height:1.65;font-size:13.8px;color:var(--ink-2)}

/* ============ QA ============ */
.qa{
  border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;margin:12px 0;
  background:linear-gradient(180deg,#fffdf8 0%,#fff 100%);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.qa:hover{border-color:#e8dba8;box-shadow:var(--shadow-sm)}
.q{font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.5;margin-bottom:10px}
.a{
  background:linear-gradient(180deg,#f0faf2 0%,#e9f7ec 100%);
  border-left:4px solid #2a9a57;padding:12px 16px;border-radius:10px;
  line-height:1.7;color:#1f5a33;font-size:13.8px;white-space:pre-wrap;
}
.a b{color:#0f4a26}

/* ============ COVERAGE ============ */
.coverage{
  margin-top:20px;border:1px solid #e4d7ae;border-radius:16px;
  background:linear-gradient(180deg,#fffaf0,#fffdf6);overflow:hidden;
}
.coverage summary{
  cursor:pointer;padding:16px 20px;font-weight:800;color:#705600;
  font-family:var(--font-display);font-size:15.5px;list-style:none;
  display:flex;align-items:center;gap:10px;transition:background .2s ease;
}
.coverage summary::-webkit-details-marker{display:none}
.coverage summary:before{content:"▸";color:var(--gold);font-weight:900;font-size:16px;transition:transform .2s ease;display:inline-block}
.coverage[open] summary:before{transform:rotate(90deg)}
.coverage summary:hover{background:#fff6ce}
.coverage-body{padding:6px 20px 20px}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.toolbar input,.toolbar select{
  flex:1;min-width:200px;padding:12px 16px;border:1px solid #e2d8b8;border-radius:12px;
  background:#fffdf8;font-size:14px;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
.toolbar input:focus,.toolbar select:focus{
  outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(201,162,39,.15);
}
.toolbar select{cursor:pointer;max-width:340px;flex:0 1 340px}

/* ============ EXAM ============ */
.exam-head{
  position:sticky;top:82px;z-index:80;
  background:rgba(255,253,247,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:18px;padding:18px 22px;
  box-shadow:0 12px 30px -12px rgba(75,55,10,.18);margin-bottom:20px;
}
.exam-head h2{margin:6px 0!important;font-size:22px!important}
.timer{
  font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--bad);
  letter-spacing:.02em;padding:8px 16px;border-radius:12px;background:var(--bad-bg);
  border:1px solid #f3cdc9;line-height:1;text-align:center;
}
.progress{
  height:10px;background:#f0e8d0;border-radius:99px;overflow:hidden;margin:14px 0 0;
  box-shadow:inset 0 1px 2px rgba(75,55,10,.06);
}
.progress>i{
  display:block;height:100%;background:linear-gradient(90deg,#c9a227 0%,#f0d060 50%,#f7e393 100%);
  border-radius:99px;transition:width .35s ease;box-shadow:0 0 12px rgba(240,212,119,.55);
}
.exam-section{margin-top:34px}
.exam-q{
  border:1px solid var(--line-2);border-radius:16px;padding:20px;margin:14px 0;
  background:#fff;box-shadow:0 1px 2px rgba(75,55,10,.03);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.exam-q:hover{border-color:#eadcae;box-shadow:var(--shadow-sm)}
.exam-q > b{font-size:14.5px;color:var(--ink);line-height:1.5;display:block;margin-bottom:12px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;border:1px solid #f0e8d0;padding:12px 14px;
  border-radius:12px;background:#fffdf8;cursor:pointer;font-size:14px;transition:all .18s ease;
}
.opt:hover{border-color:var(--gold);background:#fff9e4;transform:translateX(2px)}
.opt input{margin-top:3px;accent-color:var(--gold)}
.opt input:checked ~ span,
.opt:has(input:checked){font-weight:600;color:var(--gold-deep);border-color:var(--gold);background:#fff6ce}
.fill{
  width:100%;padding:13px 16px;border:1px solid #e2d8b8;border-radius:12px;
  background:#fffdf8;font-size:14px;transition:all .2s ease;margin-top:8px;
}
.fill:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(201,162,39,.15)}
textarea.fill{min-height:150px;resize:vertical;line-height:1.6;font-family:inherit}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin-top:8px}
.match select{
  padding:13px 16px;border:1px solid #e2d8b8;border-radius:12px;background:#fffdf8;
  font-size:14px;cursor:pointer;transition:all .2s ease;width:100%;
}
.match select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.15)}

/* ============ RESULT ============ */
.result{
  border:1px solid #e7d18a;
  background:
    radial-gradient(500px 220px at 100% 0%,rgba(242,212,119,.28),transparent 65%),
    linear-gradient(135deg,#fffaf0 0%,#fff5d8 100%);
  border-radius:24px;padding:30px;margin-top:20px;position:relative;
  overflow:hidden;box-shadow:var(--shadow-md);
}
.score{
  font-family:var(--font-display);font-size:clamp(40px,6vw,58px);font-weight:800;
  background:linear-gradient(135deg,#a97f14 0%,#7a5a05 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;margin:14px 0 12px;letter-spacing:-.02em;
}
.warn{
  padding:14px 18px;border-radius:12px;background:#fff1f0;border:1px solid #f1c7c3;
  color:#8d1e19;margin:12px 0;font-size:13.5px;line-height:1.65;
}
.lesson-card{
  padding:16px 18px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,#fffdf8,#fffaf0);font-size:13.5px;text-align:center;
  transition:border-color .2s ease,transform .2s ease;
}
.lesson-card:hover{border-color:#e5d49a;transform:translateY(-2px)}
.lesson-card b{font-family:var(--font-display);font-size:14px;color:var(--gold-deep)}

/* ============ FS OVERLAY ============ */
.fs-overlay{
  position:fixed;inset:0;z-index:9999;background:rgba(20,15,5,.94);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeUp .25s ease;
}
.fs-box{
  max-width:560px;width:100%;background:#fff;border-radius:26px;
  padding:40px 34px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.5);
  border:2px solid var(--gold);
}
.fs-box h2{color:var(--gold-deep);font-size:26px;margin:0 0 14px}
.fs-box p{color:var(--ink-2);line-height:1.75;margin:0 0 24px;font-size:15px}
.fs-box button{
  width:100%;font-size:16px;padding:16px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#d4ad34,#a97f14);color:#fff;font-weight:800;
  box-shadow:0 12px 30px -8px rgba(201,162,39,.6);transition:all .2s ease;
}
.fs-box button:hover{transform:translateY(-2px);box-shadow:0 16px 36px -8px rgba(201,162,39,.75)}

/* ============ EXAM FULLSCREEN MODE ============ */
body.exam-fs-active .topbar,
body.exam-fs-active .hero,
body.exam-fs-active .side,
body.exam-fs-active footer{display:none!important}
body.exam-fs-active{background:#fffdf8!important}
body.exam-fs-active .layout{
  max-width:100%!important;width:100%!important;
  padding:10px 14px 24px!important;grid-template-columns:1fr!important;
  gap:0!important;margin:0 auto;
}
body.exam-fs-active .content{width:100%!important;max-width:100%!important}
body.exam-fs-active .panel{
  max-width:100%!important;border-radius:16px!important;padding:18px 20px!important;
  margin-bottom:0!important;box-shadow:none!important;border:0!important;
}
body.exam-fs-active .exam-head{top:8px!important;border-radius:14px}
body.exam-fs-active .exam-q,
body.exam-fs-active h2,
body.exam-fs-active .exam-head,
body.exam-fs-active .result,
body.exam-fs-active .exam-section{
  max-width:1100px;margin-left:auto;margin-right:auto;
}
body.exam-fs-active .exam-q{display:block}

/* ============ EXAM BADGE ============ */
.exam-badge{
  position:fixed;top:14px;right:14px;z-index:100;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#1a1712,#2a2216);color:#f2d477;
  padding:9px 16px;border-radius:99px;font-size:11.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(242,212,119,.2);
  border:1px solid rgba(242,212,119,.3);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(242,212,119,.2)}50%{box-shadow:0 8px 24px rgba(201,162,39,.5),inset 0 1px 0 rgba(242,212,119,.35)}}
.exam-badge .dot{width:7px;height:7px;border-radius:50%;background:#e74c3c;box-shadow:0 0 10px #e74c3c;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ FOOTER ============ */
footer{
  text-align:center;padding:36px 20px 40px;color:var(--muted);font-size:12.5px;letter-spacing:.02em;
}
footer:before{
  content:"";display:block;width:60px;height:2px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px;
}

/* ============ ANIMATIONS ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.panel,.unit-card,.lesson-block,.qa,.definition-card{animation:fadeUp .35s ease both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ============ RESPONSIVE ============ */
@media(max-width:1050px){
  .layout{grid-template-columns:1fr;gap:18px}
  .side{position:static;max-height:none}
  .unit-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .nav{padding:10px 14px;gap:6px}
  .brand span{display:none}
  .brand img{width:44px;height:44px}
  .brand b{font-size:14px}
  .nav button{padding:8px 11px;font-size:13px}
  .hero{margin-top:20px;padding:0 12px}
  .hero-card{padding:32px 24px;border-radius:24px}
  .layout{padding:12px 12px 40px}
  .panel{padding:20px;border-radius:20px}
  .unit-grid,.definition-grid,.match{grid-template-columns:1fr}
  .lesson-body{padding:18px 16px 20px}
  .exam-head{top:64px;padding:14px}
  .timer{font-size:22px;padding:6px 12px}
}
@media(max-width:480px){
  .nav .hide-sm{display:none}
  .hero-card h1{font-size:32px}
  .hero-card{padding:26px 20px}
  .stats{gap:8px}
  .stat{padding:10px 12px;flex:1 1 calc(50% - 4px)}
}

/* Print block during exam */
@media print{
  body.exam-fs-active *{visibility:hidden!important}
  body.exam-fs-active::before{
    content:"🛑 PRINTING IS DISABLED DURING EXAM MODE";
    visibility:visible;display:block;position:fixed;inset:0;
    padding:80px 40px;font-size:26px;font-weight:800;color:#b3261e;
    text-align:center;background:#fff;z-index:99999;
  }
}

in at the content can make it \nrelevant again."},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"• Changing to a younger audience \no Increase the text size \no Check the age suitability of external links \no Add additional graphics and explanations. \n \n• Changing to an older audience. \no Make language more complex. \no Add more detailed diagrams and charts. \no Reduce the use of animation."},{"qid":"5","q":"Activity 5 — Give the required examples, points, or steps for this lesson.","a":"Include any of the following: \n• TV Programme or film marketing \n• An unsuccessful product"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• So it can be compared to the new version. \n• So a different person can work on it in the future."},{"qid":"7","q":"Activity 7 — Give the required examples, points, or steps for this lesson.","a":"Include any of the following: \n• Text \n• Images \n• Layout \n• Design"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Making improvements for a purpose"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"System life cycle"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Annotation"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"False"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L1","title":"Copyright","defs":[{"term":"Copyright","definition":"Legal protection given to the creator of original work."},{"term":"Creative Commons","definition":"A licensing system that lets creators state how others may use their work."},{"term":"Royalty-free","definition":"Content that can be used under a licence without paying a new royalty for each use."},{"term":"Public domain","definition":"Work that is not protected by copyright and can generally be used by the public."},{"term":"Open-source software","definition":"Software whose source code is available for users to inspect, modify or redistribute under its licence."}],"qas":[{"q":"What is copyright?","a":"Legal protection for original creative work."},{"q":"What is Creative Commons?","a":"A licensing approach that allows creators to give permission for particular types of reuse."},{"q":"What does public domain mean?","a":"The work is no longer protected by copyright or was never protected, so it can generally be used by the public."},{"q":"Define Copyright.","a":"Legal protection given to the creator of original work."},{"q":"Define Creative Commons.","a":"A licensing system that lets creators state how others may use their work."},{"q":"Define Royalty-free.","a":"Content that can be used under a licence without paying a new royalty for each use."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Creative Commons = Allows users to add their own copyright licence \nto their work that defines how it can be used \n• Royalty-free = Once a licence has been bought to use something, no \nfurther payments are required \n• Copyright-free = Something out of copyright and not legally owned by \nanyone"},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"• Any two of many possible correct answers including: \n• Pixabay \n• Flickr: Creative Commons \n• MobyGratis.com"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"• Varies depending on country and type of content. Often life plus 25, 50 \nor 70 years"},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Any three of many possible answers, e.g. many of the authors whose \nwork can be found in Project Gutenberg are now in the public domain \nfor most countries."},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• Designed to be free to use, edit and distribute."},{"qid":"7","q":"Activity 7 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Office-based packages \n• Graphics and picture editing software \n• Video editors \n• 3D modelling software"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Public domain"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Not-for-profit"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Commercial films"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L2","title":"Legal and Illegal Use of Content","defs":[{"term":"Legal use","definition":"Using content in a way permitted by law and by its licence."},{"term":"Illegal use","definition":"Using content in a way that breaks a law or licence."},{"term":"Plagiarism","definition":"Presenting another person's work or ideas as your own."},{"term":"VPN","definition":"A virtual private network that creates a protected connection between a device and a network service."}],"qas":[{"q":"What is the difference between legal and illegal use?","a":"Legal use follows applicable laws and licences; illegal use breaks them."},{"q":"What is plagiarism?","a":"Using another person's work or ideas and presenting them as your own."},{"q":"Why should online content be checked before reuse?","a":"It may be copyrighted, licensed for limited use or subject to other legal restrictions."},{"q":"Define Legal use.","a":"Using content in a way permitted by law and by its licence."},{"q":"Define Illegal use.","a":"Using content in a way that breaks a law or licence."},{"q":"Define Plagiarism.","a":"Presenting another person's work or ideas as your own."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Doing something legal means it is OK, doing something \nillegal is breaking the law and should not be done."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Activity Legal Illegal \nWatching films for free via a link to \na suspicious website. ✓ \nDownloading a new game from the \nstore built-into your console. ✓ \nTaking your own photos and \nposting them online. ✓ \nSearching for images online and \nselling them on your own site. ✓"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"Activity Yes No \nUsing someone else's essay as your \nown. ✓ \nAsking a parent or guardian to read \nthrough your work and offer advice. ✓ \nPosting an article in a school \nnewspaper in your name that you \nfound on another news website. \n✓ \nPaying someone to write an essay \nfor you and handing it in. ✓"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• P2P networks allow devices such as computers to share \nresources, with each device acting as both a client and a \nserver to the others in the network"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"Role Yes No \nPass on searches for illegal content to law enforcement. ✓ \nSuggest friends based on similar online search histories. ✓ \nProtect users by blocking or hiding certain sites. ✓ \nSend out warnings to users accessing illegal material. ✓"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Virtual Private Network"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Newspapers"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"True \n \n \nWorking safely in the cloud"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L3","title":"Working Safely in the Cloud","defs":[{"term":"Cloud computing","definition":"Using online services to store, process or access data and applications."},{"term":"Collaboration","definition":"Working together on shared files, projects or tasks."},{"term":"Cloud storage","definition":"Online storage that can be accessed through a network connection."},{"term":"Remote working","definition":"Working from a location away from the normal workplace, often using online services."}],"qas":[{"q":"What is cloud computing?","a":"Using Internet-based services so programs and documents can be accessed online."},{"q":"Give two advantages of cloud collaboration.","a":"People can work together remotely and access shared documents from different locations."},{"q":"What is one important cloud risk?","a":"Services may be unavailable without an Internet connection and online accounts can be attacked."},{"q":"Define Cloud computing.","a":"Using online services to store, process or access data and applications."},{"q":"Define Collaboration.","a":"Working together on shared files, projects or tasks."},{"q":"Define Cloud storage.","a":"Online storage that can be accessed through a network connection."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Cloud-based computing store everything online. This \nmeans your programs and documents are available \nanywhere you can connect to the Internet."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Statement Advantage Disadvantage \nPeople can work together across the world. ✓ \nYou can only access services when you have an \nInternet connection. ✓ \nOnline networks can be hacked. ✓ \nLots of programs can be run within an Internet \nbrowser. ✓"},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any four of the following: \n• Word processing \n• Spreadsheet modelling \n• Presentation design \n• Video conferences \n• Online form design \n• Online document storage \n• Email and calendars"},{"qid":"5","q":"Activity 5 — Give the required examples, points, or steps for this lesson.","a":"Include any two of the following: \n• Meeting via video call around the world. \n• Allowing employees to work from home. \n• Remote working. \n• Working on files together remotely. \n• Online access to documents. \n• Interviewing remotely."},{"qid":"6","q":"Activity 6 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Be respectful to other users \n• Think about the information you post \n• Avoid sharing private information. \n• Be careful what you download."},{"qid":"7","q":"Activity 7 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Computer or laptop \n• Web cam \n• Microphone \n• Speakers or headphones \n• Internet router \n• Monitor \n• Mouse and keyboard"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Collaborate"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Internet connection speed"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Image scanner"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"False"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L4","title":"Researching a Newsletter","defs":[{"term":"Newsletter","definition":"A published document containing information for a particular audience."},{"term":"Plagiarism","definition":"Using someone else's work without appropriate acknowledgement."},{"term":"Attribution","definition":"Giving credit to the source or creator of content."},{"term":"Creative Commons","definition":"A licensing system that can permit reuse under stated conditions."}],"qas":[{"q":"What is a newsletter?","a":"A published document containing information for a specific audience."},{"q":"What should you do when using online sources?","a":"Write original text, respect copyright, use permitted content and give credit to sources."},{"q":"What is attribution?","a":"Naming or crediting the source of an image, text or other content."},{"q":"Define Newsletter.","a":"A published document containing information for a particular audience."},{"q":"Define Plagiarism.","a":"Using someone else's work without appropriate acknowledgement."},{"q":"Define Attribution.","a":"Giving credit to the source or creator of content."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A newsletter is a published document, containing \ninformation for a specific audience."},{"qid":"3","q":"Activity 3 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Title and description of the contents. \n• Important dates or events \n• Suitable articles and images \n• Layout formatted to columns \n• Contact information for the newsletter creator."},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"Application Yes No \nSpreadsheet software ✓ \nWord processing software ✓ \nWebsite design software ✓ \nDatabase software ✓ \nAn integrated development environment (IDE) ✓ \nPresentation or slide-based software ✓"},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• When you create a published document, make sure you \nfollow these guidelines. \n• Write your own original text. You may use online sources \nfor reference, but do not plagiarise other people's work. \n• Use original images and graphics where possible. \n• If you use online sources, be aware of copyright laws. \nLook for sources that allow their content to be used, such \nas copyright-free or Creative Commons content. \n• Give credit for any text or image sources you use"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• When creating a newsletter it is good practice to use \noriginal images wherever possible and to give credit to \nany online sources you use. There are websites that \nprovide completely free images at no cost that will not \nbreak any copyright rules."},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"Example News article Website Interview Photograph \nClickypic – Creative Commons ✓ \nKota Padang, London – \n30/03/2021 ✓ \nwww.pearson.com ✓ \nSuperCam – copyright 2021 ✓ \nThe Guardian – 01/07/2022 ✓"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Plagiarism"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Vertically"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Naming the source of an image or piece of text"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L5","title":"Planning a Group Project","defs":[{"term":"Project schedule","definition":"A plan showing tasks, deadlines and responsibilities."},{"term":"Project brief","definition":"The requirements and purpose of a project."},{"term":"Deadline","definition":"The latest time or date by which a task should be completed."},{"term":"Cloud-based collaboration","definition":"Working together using online tools and shared files."}],"qas":[{"q":"What should a group do before starting a project?","a":"Read the brief, confirm the deadline, identify members, divide tasks and choose suitable software."},{"q":"What should a task schedule record?","a":"The work to be done, who will do it and how long it should take."},{"q":"Why assign tasks and deadlines?","a":"It makes responsibilities clear and helps the group complete the project on time."},{"q":"Define Project schedule.","a":"A plan showing tasks, deadlines and responsibilities."},{"q":"Define Project brief.","a":"The requirements and purpose of a project."},{"q":"Define Deadline.","a":"The latest time or date by which a task should be completed."}],"coverage":[{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Any four of the below: \n• Read the project brief carefully. \n• Make sure you know when the final deadline is. \n• Identify the members of the group. \n• Break the project down into key tasks. \n• Create a work schedule with tasks and deadlines. \n• Assign tasks and deadlines to members of the group. \n• Choose the software you will use and make sure all group \nmembers know how to use"},{"qid":"4","q":"Activity 4 — Give your own suitable example following the lesson requirements.","a":"Student's own answer."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Task or Work to do \n• Name of person to do it \n• How long should be spent on task"},{"qid":"7","q":"Activity 7 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Read the project brief carefully \n• Check the deadline \n• Identify the members of the group. \n• Break the project down into key tasks. \n• Assign tasks and deadlines to members of the group. \n• Make a software choices"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Schedule"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Spreadsheet software"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Cloud-based computing"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"True"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L6","title":"Document Layout","defs":[{"term":"Portrait","definition":"A page orientation that is taller than it is wide."},{"term":"Landscape","definition":"A page orientation that is wider than it is tall."},{"term":"Placeholder","definition":"A reserved position where text or an image can be inserted."},{"term":"Margin","definition":"The space around the edge of a page."},{"term":"Template","definition":"A reusable document layout."}],"qas":[{"q":"What is the difference between portrait and landscape?","a":"Portrait is vertical; landscape is horizontal."},{"q":"What are placeholders used for?","a":"They reserve positions where text or images can be added."},{"q":"Why use a template?","a":"It saves time and keeps repeated documents consistent."},{"q":"Define Portrait.","a":"A page orientation that is taller than it is wide."},{"q":"Define Landscape.","a":"A page orientation that is wider than it is tall."},{"q":"Define Placeholder.","a":"A reserved position where text or an image can be inserted."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A portrait document is vertical, a landscape document is \nhorizontal."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"• Placeholders = Positions on the page where text and \nimages will be added \n• Margins = The space around the edge of the page \n• Columns = Dividing a page into vertical text areas"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"• A template is an agreed layout that can be used over and \nover again to create documents."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"Element Yes No \nDocument layout ✓ \nContent ✓ \nGraphics or images related to the \ncontent ✓ \nDesign elements such as font and \ncolour choices ✓ \nKey pieces of information ✓"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• Time-saving: the layout doesn't need to be redesigned for \neach edition. This is especially useful for a regularly \npublished document like a newsletter. \n• Collaboration: several people can contribute content \nwithout worrying about the layout. \n• Consistency: each edition follows the same professional \nlayout and style"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"Long running newsletters and magazines have an established \nhouse style and page layout. This means as new issues are \ncreated, new story headlines and content are simply dropped into \ntheir placeholders."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"2 or 3"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Template"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Layout"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L7","title":"Document Page Design","defs":[{"term":"Header","definition":"Content placed at the top of a page."},{"term":"Footer","definition":"Content placed at the bottom of a page."},{"term":"Page break","definition":"A marker that starts content on a new page."},{"term":"Subheading","definition":"A smaller heading used to organise a section of content."}],"qas":[{"q":"Where is a header placed?","a":"At the top of a page."},{"q":"What is a page break?","a":"A marker in an electronic document that starts a new page."},{"q":"Why use headers and footers?","a":"They can consistently display items such as logos, dates, filenames, authors or page numbers."},{"q":"Define Header.","a":"Content placed at the top of a page."},{"q":"Define Footer.","a":"Content placed at the bottom of a page."},{"q":"Define Page break.","a":"A marker that starts content on a new page."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A header is found at the top of the page and the footer at the bottom of the page."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Application Header Footer \nLogos ✓ \nFilename ✓ \nDate ✓ \nBackground effects ✓ ✓ \nAuthor ✓ \nPage number ✓"},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Page numbers can be at the bottom or side of a page. \n• Not to number a front cover of a publication. \n• Page number can be reset at any point. \n• Can be set to numbering only odd or even pages. \n•"},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Page breaks – a marker in an electronic document to signify the start of a new \npage \n• Grouping – content such as columns and images can be grouped so they can be \nmoved together"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"Page heading \nHeader title \nsubheadings \nFooter page \nnumbers \nFooter titles"},{"qid":"7_Q1","q":"Checkpoint 7_Q1 — Select the correct answer for the lesson lete the key task covered by this activity.","a":"Element A price \nlist \nSales \nfigures, \nyear by \nyear \nA new \nlogo \nA feature \nheadline \nGraphical shapes ✓ \nTables ✓ \nCharts or graphs ✓ \nText boxes ✓"},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Text forms a box around the shape. \n• Text follows the edge of the shape. \n• Text goes in front of the shape. \n• Text goes behind the shape."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• It is designed to present data, key terms and timelines in \nan interesting way."},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"• Rotation = Spinning around its centre point. \n• Opacity = Being able to see through an image or graphic \nto the background behind. \n• Image adjustment = Setting the brightness and contrast."},{"qid":"7","q":"Activity 7 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Solid fill \n• Pattern fill \n• Texture fill \n• Photo fill"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Chart"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Alignment"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Border"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Patterns"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Image-editing software"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L9","title":"Reviewing and Proofreading Documents","defs":[{"term":"Peer review","definition":"Feedback from another person used to identify errors or improve work."},{"term":"Proofreading","definition":"Checking a document carefully for errors in spelling, grammar, layout and meaning."},{"term":"Spell check","definition":"A tool that identifies possible spelling errors."},{"term":"Thesaurus","definition":"A tool that suggests alternative words with related meanings."}],"qas":[{"q":"What is peer review?","a":"Asking another person to read work and provide feedback for improvement."},{"q":"What should proofreading look for?","a":"Spelling, grammar, wording, layout problems and suitability for the target audience."},{"q":"Name useful document-review tools.","a":"Spell check, grammar check, thesaurus, word count and readability checks."},{"q":"Define Peer review.","a":"Feedback from another person used to identify errors or improve work."},{"q":"Define Proofreading.","a":"Checking a document carefully for errors in spelling, grammar, layout and meaning."},{"q":"Define Spell check.","a":"A tool that identifies possible spelling errors."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Asking those around you of a similar age, at home or at \nschool, to look at a piece of work and offer feedback \ncomments to help improve it."},{"qid":"3","q":"Activity 3 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Spelling and grammar errors \n• Poorly worded text. \n• Text, image and graphic clashes in layout. \n• Target audience suitability."},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Spell check \n• Grammar check \n• Thesaurus \n• Word count \n• Language choice \n• Readability checks"},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Asking someone to read though a document and identify \npotential errors or language issues."},{"qid":"6","q":"Activity 6 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Any from the following: \nAdvantages Disadvantages \nShared comments. People disagreeing at the same time. \nCreating a wider agreed review. Not actually agreeing on a conclusion. \nComments from a range of users. Not everyone being heard."},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"• To create a list of agreed review comments that can be \nactioned on, one at a time."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"The local language"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"WordArt"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Anyone can delete comments"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"True"}]},{"unit":"Unit 2","unitName":"Responsible Practice","code":"L10","title":"Distributing Digital Documents","defs":[{"term":"Digital distribution","definition":"Sending digital copies of a document to one or many recipients."},{"term":"Compression","definition":"Reducing file size by encoding data into a smaller representation."},{"term":"Decompression","definition":"Restoring compressed data to a usable form."},{"term":"PDF","definition":"Portable Document Format, a digital document format designed for consistent viewing across devices."}],"qas":[{"q":"What is digital distribution?","a":"Sending digital copies of a document to recipients using online or digital methods."},{"q":"Why compress a file?","a":"A smaller file is generally quicker and easier to send or download."},{"q":"What is a PDF?","a":"A Portable Document Format file designed to preserve a document's appearance across devices."},{"q":"Define Digital distribution.","a":"Sending digital copies of a document to one or many recipients."},{"q":"Define Compression.","a":"Reducing file size by encoding data into a smaller representation."},{"q":"Define Decompression.","a":"Restoring compressed data to a usable form."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• The process of sending out digital copies of a document to \nmultiple recipients at the same time to anywhere in the \nworld."},{"qid":"3","q":"Activity 3 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Attaching a document to an email. \n• As a download from a website. \n• Using file transfer websites. \n• Via instant messaging systems. \n• Via links within social media posts."},{"qid":"4","q":"Activity 4 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Activity Advantage Disadvantage \nThousands of copies can be sent out simultaneously. ✓ \nPeople may receive copies they did not ask for. ✓ \nErrors can be quickly rectified and new copies sent. ✓ \nDigital downloads are often linked to viruses. ✓"},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Compression reduces the data size of a file, or folder of \nfiles, into a compressed file format that can be distributed."},{"qid":"6","q":"Activity 6 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Activity Advantage Disadvantage \nSmaller documents are easier and quicker to send. ✓ \nFile decompression can result in errors. ✓ \nViruses are often disguised as compressed files. ✓ \nSuitable for slower Internet connection speeds. ✓"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"PDF stands for Portable Document Format and is a digital \ndistribution file. It has been designed to show high quality \npublications on a wide range of devices. It can include text, \ngraphics and images and only requires a basic PDF viewer to \nread it."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Physical post"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Decompression"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"ZIP"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Acrobat Reader"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L1","title":"Wired and Wireless Networks","defs":[{"term":"Router","definition":"A device that directs data between a local network and other networks such as the Internet."},{"term":"Wired connection","definition":"A network connection using a physical cable."},{"term":"Wireless connection","definition":"A connection that transmits data using radio waves."},{"term":"Encryption","definition":"Encoding data so unauthorised users cannot easily read it."}],"qas":[{"q":"What does a router do?","a":"It connects a local network to other networks and directs data between them."},{"q":"What is the difference between wired and wireless networking?","a":"Wired networks use physical cables; wireless networks use electromagnetic radio signals."},{"q":"Why is encryption important?","a":"It helps prevent unauthorised people from accessing network data."},{"q":"Define Router.","a":"A device that directs data between a local network and other networks such as the Internet."},{"q":"Define Wired connection.","a":"A network connection using a physical cable."},{"q":"Define Wireless connection.","a":"A connection that transmits data using radio waves."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A device that connects your home network to the Internet \nand directs data between the two."},{"qid":"3","q":"Activity 3 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Computer \n• Laptop \n• Tablet \n• Smartphone \n• Smart TV \n• Games console"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"A wired connection is a physical connection between devices. The \ncable is constructed from copper wire or fibre optic cable. \nWireless systems use electromagnetic radio waves to transmit \ndata between devices."},{"qid":"5","q":"Activity 5 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Activity Advantages Disadvantages \nThe lack of wires means people can connect from \nany location within the broadcast area. ✓ \nMore users can be easily connected. ✓ \nSignals have a limited range. ✓ \nThick walls and other devices can cause \ninterference. ✓"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"Encryption prevents outside users connecting to a network and \nsharing data without a password."},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"Include two any of the following: \n• Prevent unwanted users. \n• Prevent data being taken. \n• Prevent viruses being spread. \n• To control access."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Internet Service Provider"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Radio"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Clothing"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Encryption"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L2","title":"Mobile Internet Access","defs":[{"term":"Mobile Internet","definition":"Internet access provided through mobile networks and cell towers."},{"term":"Cell tower","definition":"A radio communication station that connects mobile devices to a mobile network."},{"term":"Mobile data allowance","definition":"The amount of mobile data included in a user's plan."},{"term":"Generation (2G/3G/4G/5G)","definition":"A stage of mobile network technology with different capabilities and speeds."}],"qas":[{"q":"How is mobile Internet different from Wi-Fi?","a":"Mobile Internet connects through cellular towers and can work across a wider area, while Wi-Fi is usually local."},{"q":"How did mobile generations develop?","a":"2G supported basic data, 3G enabled practical mobile browsing, 4G improved streaming and gaming, and 5G offers much higher performance."},{"q":"Why can mobile data be expensive?","a":"A user's plan may have a limited allowance and extra usage can cost more."},{"q":"Define Mobile Internet.","a":"Internet access provided through mobile networks and cell towers."},{"q":"Define Cell tower.","a":"A radio communication station that connects mobile devices to a mobile network."},{"q":"Define Mobile data allowance.","a":"The amount of mobile data included in a user's plan."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A Wi-Fi connection is normally from a home or office and \nlimited in range. A mobile Internet connection connects to \nmobile towers and allows for access almost anywhere."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"• 2G = Very slow speed, most text and small images. \n• 3G = Allowed Internet browsing for the first time. \n• 4G = Allows Internet streaming and gaming. \n• 5G = Almost home broadband speed on the move."},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Mobile multiplayer gaming. \n• Video calls on the move. \n• Cloud computing applications. \n• Working remotely. \n• Streaming high quality video and music."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Students will often compare devices and those with older \ndevices, just like any fashionable item, may be bullied. \nThis leads to pressure to get the latest models."},{"qid":"6","q":"Activity 6 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Activity Advantages Disadvantages \nBattery life is quickly drained whilst browsing. ✓ \nUsers aren't aware of the cost of data per gigabyte. ✓ \nRelacing home broadband with a 5G connection. ✓ \nSharing a mobile connection with a laptop or tablet. ✓"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"Activity True False \nNew 5G networks are the cause of conspiracy stories \nwith no medical evidence to support them. \n✓ \nThe cost per gigabyte for mobile broadband is cheaper \nthan home broadband. \n ✓ \nMany mobile phone apps will still download data when \nnot being used. \n✓"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Cell towers"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Mobile data allowance"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Generation"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"A broadband contract"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L3","title":"Wired Connections","defs":[{"term":"Ethernet","definition":"A common wired networking technology using copper-based cables."},{"term":"Fibre-optic cable","definition":"A cable that transmits data as pulses of light."},{"term":"Twisted-pair cable","definition":"Copper cable made from pairs of twisted wires to reduce interference."},{"term":"Standardisation","definition":"Agreement on common technologies or connectors so equipment can work together."}],"qas":[{"q":"What is Ethernet?","a":"A common wired networking technology using standard copper cables and connectors."},{"q":"How does fibre-optic networking transmit data?","a":"It sends data as light pulses through optical fibres."},{"q":"Why are standards important?","a":"They allow equipment from different manufacturers to use compatible technologies and connectors."},{"q":"Define Ethernet.","a":"A common wired networking technology using copper-based cables."},{"q":"Define Fibre-optic cable.","a":"A cable that transmits data as pulses of light."},{"q":"Define Twisted-pair cable.","a":"Copper cable made from pairs of twisted wires to reduce interference."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A light signal in one end of the cable and at the speed of \nlight the same signal appears at the other end."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"• Ethernet \no Manufactured from copper wire. \no Known as twisted-pair cables. \no End terminal connector is now an industry \nstandard. \n• Fibre-optic \no Light pulses create a binary signal. \no Transmits data using light."},{"qid":"4","q":"Activity 4 — Give the required examples, points, or steps for this lesson.","a":"Include any two of the following: \n• Connecting countries together. \n• Crossing large areas and oceans. \n• Takes network connections to remote areas. \n• Much more stable for large data files. \n• Reliable consistent connection."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"Advantage: \n• Commonly used \n• Standard connectors \n• Fast data connection – 100Gbps \nDisadvantage: \n• Limited to around 100m \n• Affected by interference \n• Can be physically broken"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"Advantage: \n• Extremely fast \n• Able to travel any distance \n• Consistent \nDisadvantage: \n• More expensive than ethernet \n• Not practical for smaller networks \n• Can be physically broken."},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"• It allows different companies and manufacturers around \nthe world to create devices that use the same socket and \nnetwork technology."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Binary"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"100 Gbps"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Ethernet cable"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L4","title":"Satellite Communication","defs":[{"term":"Satellite","definition":"A communication device that orbits Earth and relays signals over long distances."},{"term":"Satellite navigation","definition":"A location system using signals from satellites to determine position."},{"term":"Radio waves","definition":"Electromagnetic waves used for wireless communication."},{"term":"Geolocation","definition":"Determining or tagging the geographic location of a device, photo or post."}],"qas":[{"q":"What is a communication satellite?","a":"A satellite that orbits Earth and relays communication signals."},{"q":"Why are satellites useful for remote locations?","a":"They can provide communication without requiring a physical cable to every location."},{"q":"What is geolocation used for?","a":"It can attach a location to a photo, social post, map activity or navigation result."},{"q":"Define Satellite.","a":"A communication device that orbits Earth and relays signals over long distances."},{"q":"Define Satellite navigation.","a":"A location system using signals from satellites to determine position."},{"q":"Define Radio waves.","a":"Electromagnetic waves used for wireless communication."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• A satellite is communication device that orbits the earth, \nallowing signals to be sent across the planet."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Satellites orbit the earth at a height of over 20,000 kilometres. \nBeing so high above the earth means a signal can be sent directly \nto one and it can relay that signal to another location thousands of \nmiles away. Multiple satellites allows data can be sent around the \nworld."},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"• Television = Live news broadcasts around the world. \n• Radio = Music and discussion around the world \n• Government = Secure messages between key personnel \n• Location data = Car satellite navigation systems. \n• Telephone = Allows calls to be made across the world."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"Advantages: \n• Communication without cables \n• Able to connect in rural or remote locations \nDisadvantages: \n• Environmental cost of lunching rockets \n• Expensive to launch and maintain \n• Danger of collisions in orbit."},{"qid":"6","q":"Activity 6 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Car sat nav \n• Smartphone mapping \n• Aircraft and shipping navigation \n• Fitness trackers"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"• In order to add, or tag, the location of where a photo has \nbeen taken or a social network post was made."},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Around a 1000"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"True"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Radio waves"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Temperature"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"False"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L5","title":"Internet Bandwidth","defs":[{"term":"Bandwidth","definition":"The amount of data that can be transferred by a connection in a given time."},{"term":"Latency","definition":"The delay between sending data and receiving a response."},{"term":"Ping","definition":"A measurement commonly used to test network response time."},{"term":"Bits per second","definition":"A unit describing how many bits can be transmitted in one second."}],"qas":[{"q":"What is bandwidth?","a":"The amount of data a network connection can transfer per second."},{"q":"What is latency?","a":"The time delay experienced when data travels through a network."},{"q":"What is a good combination for interactive Internet use?","a":"High bandwidth and low latency."},{"q":"Define Bandwidth.","a":"The amount of data that can be transferred by a connection in a given time."},{"q":"Define Latency.","a":"The delay between sending data and receiving a response."},{"q":"Define Ping.","a":"A measurement commonly used to test network response time."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Bandwidth describes how much data can be transferred \nfrom one network device to another in one second."},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"• Bandwidth is the amount of data per second and Internet \nspeed related to how quickly data arrives."},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"We can think about bandwidth as the size of a water pipe. The water represents data and \ntherefore the wider the pipe, the more data that can be sent down it in the same amount of time."},{"qid":"5","q":"Activity 5 — Explain or complete the key task covered by this activity.","a":"• Latency is the name given to the time delay in a computer. \nLow latency means short delays and high latency means \nlong delays."},{"qid":"6","q":"Activity 6 — Identify the correct categories, advantages/disadvantages, or prevention steps.","a":"Concern Prevention \nDevices sharing data Reduce the number of devices in the building \nConnection quality Replace damaged or older cables \nInterference Remove interference sources such as large pieces of \nequipment or nearby power cables."},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"• Low latency \n• High bandwidth \n•"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Bits per second"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"Amount of data and speed"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Ping rate"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Milliseconds"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"True"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L6","title":"Comparing Web Browsers","defs":[{"term":"Web browser","definition":"An application used to display HTML pages and navigate the WWW."},{"term":"HTML","definition":"HyperText Markup Langua tion."},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"Activity Yes No \nBrand name ✓ \nDisplay of similar text and graphics ✓ \nButton icon styles ✓ \nCross-platform preferences ✓ \nColour scheme ✓ \nSpelling of browser name ✓ \nPlug-in functionality ✓ \nBrowsing speed ✓"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"HTML"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Address bar"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"Does not save browsing history"}]},{"unit":"Unit 3","unitName":"Connectivity and the Internet","code":"L7","title":"Comparing Search Engines","defs":[{"term":"Search engine","definition":"A web service that finds pages based on keywords and displays results."},{"term":"Search history","definition":"A record of recent search terms and related browsing activity."},{"term":"Autocomplete","definition":"A feature that predicts or completes a search query as it is typed."},{"term":"Advanced search","definition":"Search controls that let a user specify extra criteria."}],"qas":[{"q":"What is a search engine?","a":"A web page or service that searches other web pages using keywords and shows results."},{"q":"What is search history?","a":"A record of terms entered into a search engine and related pages recently visited."},{"q":"Why can the first result be misleading?","a":"Some results may be advertisements or paid placements rather than the most relevant result."},{"q":"Define Search engine.","a":"A web service that finds pages based on keywords and displays results."},{"q":"Define Search history.","a":"A record of recent search terms and related brows illion"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"• An analogue signal is a recording of the actual sound but \na digital sound converts it to a binary sequence."},{"qid":"5","q":"Activity 5 — Give the required examples, points, or steps for this lesson.","a":"Include any three of the following: \n• Mp3 \n• DAB \n• Streaming audio \n• Digital Radio \n• Compact Disc \n• Minidisc"},{"qid":"6","q":"Activity 6 — Explain or complete the key task covered by this activity.","a":"Time Amplitude (Denary) 4-bit binary \n0 6 0110"},{"qid":"7","q":"Activity 7 — Explain or complete the key task covered by this activity.","a":"• See above"},{"qid":"8_Q1","q":"Checkpoint 8_Q1 — Select the correct answer for the lesson quick quiz.","a":"Light switch"},{"qid":"8_Q2","q":"Checkpoint 8_Q2 — Select the correct answer for the lesson quick quiz.","a":"False"},{"qid":"8_Q3","q":"Checkpoint 8_Q3 — Select the correct answer for the lesson quick quiz.","a":"Vinyl turntable"},{"qid":"8_Q4","q":"Checkpoint 8_Q4 — Select the correct answer for the lesson quick quiz.","a":"Microphone"},{"qid":"8_Q5","q":"Checkpoint 8_Q5 — Select the correct answer for the lesson quick quiz.","a":"the quality will be higher"}]},{"unit":"Unit 4","unitName":"Internet Protocol and Binary","code":"L3","title":"Converting from Binary to Denary","defs":[{"term":"Base 2","definition":"The binary number system using powers of two."},{"term":"Base 10","definition":"The denary decimal system using digits 0–9."},{"term":"Place value","definition":"The value assigned to a digit according to its position."},{"term":"Denary","definition":"The ordinary decimal number system."}],"qas":[{"q":"What is base 2?","a":"A number system based on powers of two and using only 0 and 1."},{"q":"How do you convert binary to denary?","a":"Add the place values represented by the binary 1s."},{"q":"What is the maximum value of an 8-bit unsigned binary number?","a":"255."},{"q":"Define Base 2. ]},{"unit":"Unit 4","unitName":"Internet Protocol and Binary","code":"L4","title":"Converting from Denary to Binary","defs":[{"term":"Denary","definition":"The decimal number system based on ten digits."},{"term":"8-bit binary","definition":"A binary representation containing eight positions."},{"term":"Remainder","definition":"The value left after a division that does not divide evenly."},{"term":"Most significant bit (MSB)","definition":"The leftmost bit with the highest place value."},{"term":"Least significant bit (LSB)","definition":"The rightmost bit with the lowest place value."}],"qas":[{"q":"How can a denary number be converted to binary?","a":"Repeatedly divide by two and record the remainders, then read the remainders in reverse order."},{"q":"What is the LSB?","a":"The rightmost binary digit with the lowest place value."},{"q":"What is the MSB?","a":"The leftmost binary digit with the highest place value."},{"q":"Define Denary.","a":"The decimal number system based on ten digits."},{"q":"Define 8-bit binary.","a":"A binary representation containing eight positions."},{"q":"Define Remainder.","a":"The value left after a division that does not divide evenly."}],"coverage":[{"qid":"2","q":"Activity 2 — Explain or complete the key task covered by this activity.","a":"• Divide the denary number by two \n• If a remainder of 1 is found put it in the leftmost available \n8-bit binary place value table column (20 to begin with) \n• If no remainder is found put a 0 in the leftmost available 8-\nbit binary place value table column (2\n0 to begin with) \n• Take the new halved number and repeat the process until \nthe table is completed"},{"qid":"3","q":"Activity 3 — Explain or complete the key task covered by this activity.","a":"Denary \nnumber \n8-bit binary \n21 0 0 0 1 0 1 0 1 \n48 0 0 1 1 0 0 0 0 \n99 0 1 1 0 0 0 1 1 \n158 1 0 0 1 1 1 1 0 \n243 1 1 1 1 0 0 1 1"},{"qid":"4","q":"Activity 4 — Explain or complete the key task covered by this activity.","a":"Answer function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function unitName(u){return LESSONS.find(x=>x.unit===u)?.unitName||'';}
function go(v,u='all'){view=v;activeUnit=u;render();}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,' ');}

 </section>
 <section class="panel"><h2>Units</h2><div class="unit-grid">

 </div></section>
 <section class="panel"><h2>Exam Format — Every Unit</h2><div class="unit-grid">
