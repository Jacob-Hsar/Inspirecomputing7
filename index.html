  <div class="lesson-card"><b>Part B</b><br>10 Fill in the Blank</div>
  <div class="lesson-card"><b>Part C</b><br>10 Matching</div>
  <div class="lesson-card"><b>Part D</b><br>10 Short Questions</div>
  <div class="lesson-card"><b>Part E</b><br>2 Long Questions × 5 marks</div>
  <div class="lesson-card"><b>Total</b><br>60 marks • 60 minutes</div>
 </div></section>`);
}

function renderStudy(){
 const list=LESSONS.filter(x=>activeUnit==='all'||x.unit===activeUnit);
 const reviewUnits=activeUnit==='all'?['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5','Unit 6']:[activeUnit];
 const reviewHtml=reviewUnits.map(u=>`<details class="coverage" style="margin-top:14px"><summary>📝 ${esc(u)} — End-of-Unit 4-mark Revision</summary><div class="coverage-body">${(UNIT_REVIEWS[u]||[]).map((r,i)=>`<div class="qa"><div class="q">${esc(r.q)}</div><div class="a"><b>Key points / answer:</b> ${esc(r.a)}</div></div>`).join('')}</div></details>`).join('');
 shell(`<section class="panel">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2>📚 Units &amp; Lessons</h2><p class="muted">Click a lesson to study definitions, concise Q&amp;A, then expand the complete answer-key coverage.</p></div><button class="gold" onclick="startExam(activeUnit==='all'?'all':activeUnit)">🔒 Start 60-Min Exam</button></div>
 <div class="toolbar"><input id="lessonSearch" placeholder="Search unit, lesson, definition, question or answer..." oninput="filterLessons()"><select id="unitFilter" onchange="activeUnit=this.value;renderStudy()"><option value="all">All units</option>${[1,2,3,4,5,6].map(n=>`<option value="Unit ${n}" ${activeUnit==='Unit '+n?'selected':''}>Unit ${n} — ${esc(unitName('Unit '+n))}</option>`).join('')}</select></div>
 <div id="lessonResults">${list.map((x,i)=>lessonHtml(x,i)).join('')}</div>
 ${reviewHtml}
 </section>`);
}

 const searchText=(x.unit+' '+x.unitName+' '+x.code+' '+x.title+' '+x.defs.map(d=>d.term+' '+d.definition).join(' ')+' '+x.qas.map(q=>q.q+' '+q.a).join(' ')+' '+coverage.map(q=>q.q+' '+q.a).join(' ')).toLowerCase();
 return `<div class="lesson-block" data-search="${esc(searchText)}">
  <div class="lesson-head"><div><span class="badge">${esc(x.unit)} • ${esc(x.code)}</span><h3>${esc(x.title)}</h3></div><button onclick="this.closest('.lesson-block').querySelector('.lesson-body').classList.toggle('hidden')">Open / Close</button></div>
  <div class="lesson-body">
   <h4>📖 Key Definitions — Term → Definition</h4>
   <div class="definition-grid">${x.defs.map(d=>`<div class="definition-card"><div class="definition-term">${esc(d.term)}</div><p>${esc(d.definition)}</p></div>`).join('')}</div>
   <h4>❓ Study Questions &amp; Answers</h4>
   ${x.qas.map((q,j)=>`<div class="qa"><div class="q">Q${j+1}. ${esc(q.q)}</div><div class="a"><b>Answer:</b> ${esc(q.a)}</div></div>`).join('')}
   <details class="coverage"><summary>📌 Complete Answer-Key Coverage — ${coverage.length} source answer blocks</summary>
    <div class="coverage-body">
    <p class="muted">These are reconstructed prompts paired with the corresponding answers from the supplied answer-key PDF. Tables/classifications are preserved in text form.</p>
    ${coverage.map((q,j)=>`<div class="qa"><div class="q">${esc(q.q)}</div><div class="a"><b>Answer:</b> ${esc(q.a)}</div></div>`).join('')}
    </div>
   </details>
  </div>
 </div>`;
}

function filterLessons(){
 const q=(document.getElementById('lessonSearch').value||'').toLowerCase();
 document.querySelectorAll('.lesson-block').forEach(el=>el.style.display=el.dataset.search.includes(q)?'block':'none');
}

function renderDefinitions(){
 shell(`<section class="panel"><h2>📖 Key Definitions</h2><p class="muted">Definitions are written in clear study form, for example <b>Binary — a computer representation using 0 and 1</b>. Search by term, unit or meaning.</p>
 <div class="toolbar"><input id="defSearch" placeholder="Search term or definition..." oninput="filterDefs()"></div>
 <div id="defs" class="definition-grid">${TERMS.map(d=>`<div class="definition-card def-card" data-s="${esc((d.term+' '+d.definition+' '+d.unit+' '+d.lesson).toLowerCase())}"><div class="definition-term">${esc(d.term)}</div><p>${esc(d.definition)}</p><small class="muted" style="display:block;margin-top:8px;font-size:11.5px">${esc(d.unit)} • ${esc(d.lesson)}</small></div>`).join('')}</div></section>`);
}
function filterDefs(){
 const q=(document.getElementById('defSearch').value||'').toLowerCase();
 document.querySelectorAll('.def-card').forEach(x=>x.style.display=x.dataset.s.includes(q)?'block':'none');
}

function makeExam(scope){
 const units=scope==='all'?['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5','Unit 6']:[scope];
 const poolTerms=shuffle(TERMS.filter(t=>units.includes(t.unit)));
 const poolQ=shuffle(units.flatMap(u=>LESSONS.filter(l=>l.unit===u).flatMap(l=>l.qas.map(q=>({...q,unit:u,lesson:l.title})))));
 if(poolTerms.length<20) throw new Error('Not enough terms for this exam.');
 const mcTerms=poolTerms.slice(0,20);
 const mc=mcTerms.map(t=>{
   let distract=shuffle(poolTerms.filter(x=>x.term!==t.term)).slice(0,3).map(x=>x.term);
   let opts=shuffle([t.term,...distract]);
   return {type:'mc',q:`Which term best matches this definition? “${t.definition}”`,opts,ans:opts.indexOf(t.term),unit:t.unit,lesson:t.lesson};
 });
 const fill=poolTerms.slice(20,30).map(t=>({type:'fill',q:`Fill in the blank: ${t.definition}`,ans:t.term,unit:t.unit,lesson:t.lesson}));
 const mt=poolTerms.slice(30,40);
 const right=shuffle(mt.map(x=>x.definition));
 const match=mt.map(x=>({term:x.term,answerIndex:right.indexOf(x.definition),unit:x.unit,lesson:x.lesson}));
 const short=shuffle(poolTerms.slice(40,50)).map(t=>({type:'short',q:`What is the key term for this definition? ${t.definition}`,ans:t.term,unit:t.unit,lesson:t.lesson}));
 const longData=units.length===1?(LONGS[scope]||[]):LONGS['Unit 1'];
 const long=longData.slice(0,2).map(z=>({type:'long',q:z.q,keywords:z.keywords,ans:z.model}));
 return {scope,units,mc,fill,match,right,short,long,startedAt:Date.now(),answers:{},violations:0,submitted:false};
}

function startExam(scope='all'){
 try{
   exam=makeExam(scope);view='exam';examStarted=false;examSubmitted=false;violationCount=0;
   document.body.classList.add('exam-fs-active');
   addExamBadge();
   render();
   showFullscreenGate();
 }catch(e){alert(e.message);}
}

function addExamBadge(){
 removeExamBadge();
 const b=document.createElement('div');
 b.className='exam-badge';b.id='examBadge';
 b.innerHTML='<span class="dot"></span> 🔒 Secure Exam Mode • '+(exam.scope==='all'?'Full Year':exam.scope);
 document.body.appendChild(b);
}
function removeExamBadge(){
 const b=document.getElementById('examBadge');if(b)b.remove();
}

function showFullscreenGate(){setTimeout(()=>document.getElementById('fsOverlay')?.classList.remove('hidden'),50);}

async function enterExamFullscreen(){
 try{
   await document.documentElement.requestFullscreen();
   document.getElementById('fsOverlay')?.classList.add('hidden');
   examStarted=true;
   exam.startedAt=Date.now();
   startTimer();
 }catch(e){
   document.getElementById('fsOverlay')?.classList.add('hidden');
   examStarted=true; exam.startedAt=Date.now(); startTimer();
   alert('Browser full-screen permission was not granted. The exam still runs, but full-screen should be enabled for the best security.');
 }
}

function startTimer(){
 clearInterval(timer);
 timer=setInterval(()=>{
   if(!exam||examSubmitted)return;
   const left=Math.max(0,3600-Math.floor((Date.now()-exam.startedAt)/1000));
   updateTimer(left);
   if(left<=0){clearInterval(timer);submitExam(true);}
 },1000);
}

function updateTimer(left){
 const el=document.getElementById('timer'); if(!el)return;
 const m=Math.floor(left/60),s=left%60;
 el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 const bar=document.getElementById('examProgress'); if(bar)bar.style.width=Math.max(0,Math.min(100,left/36))+'%';
}

function answer(k,v){if(exam&&!examSubmitted)exam.answers[k]=v;}

function longScore(text,keywords){
 const s=norm(text);
 return keywords.reduce((n,k)=>s.includes(norm(k))?n+1:n,0);
}

function submitExam(auto=false){
 if(!exam||examSubmitted)return;
 examSubmitted=true; clearInterval(timer);
 removeExamBadge();
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 let score=0, max=60, wrong=[], section={mc:0,fill:0,match:0,short:0,long:0};
 exam.mc.forEach((q,i)=>{if(Number(exam.answers['mc'+i])===q.ans){score++;section.mc++;}else wrong.push(['MCQ '+(i+1),q.q,'Correct: '+q.opts[q.ans]]);});
 exam.fill.forEach((q,i)=>{if(norm(exam.answers['fill'+i])===norm(q.ans)){score++;section.fill++;}else wrong.push(['Fill '+(i+1),q.q,'Correct: '+q.ans]);});
 exam.match.forEach((q,i)=>{if(Number(exam.answers['match'+i])===q.answerIndex){score++;section.match++;}else wrong.push(['Matching '+(i+1),q.term,'Correct: '+exam.right[q.answerIndex]]);});
 exam.short.forEach((q,i)=>{if(norm(exam.answers['short'+i])===norm(q.ans)){score++;section.short++;}else wrong.push(['Short '+(i+1),q.q,'Correct: '+q.ans]);});
 exam.long.forEach((q,i)=>{
   const s=longScore(exam.answers['long'+i]||'',q.keywords);
   score+=s; section.long+=s;
   if(s<q.keywords.length)wrong.push(['Long '+(i+1),q.q,'Auto-check model points: '+q.ans+' | Keyword score: '+s+'/'+q.keywords.length]);
 });
 const pct=Math.round(score/max*100);
 const mistakeHtml=wrong.length?wrong.map(w=>`<div class="qa"><b>${esc(w[0])}</b><div>${esc(w[1])}</div><div class="a">${esc(w[2])}</div></div>`).join(''):'<div class="a">Excellent — no auto-checked mistakes.</div>';
 const longHtml=exam.long.map((q,i)=>`<div class="qa"><div class="q">${esc(q.q)}</div><div class="a"><b>Model answer:</b> ${esc(q.ans)}<br><br><b>Your keyword score:</b> ${longScore(exam.answers['long'+i]||'',q.keywords)}/${q.keywords.length}<br><b>Your answer:</b><br>${esc(exam.answers['long'+i]||'(No answer)')}</div></div>`).join('');
 document.getElementById('examArea').innerHTML=`<div class="result">
  <span class="badge">${auto?'AUTO-SUBMITTED — TIME EXPIRED':'SUBMITTED'}</span>
  <div class="score">${score} / ${max}</div>
  <h3>${pct}% Auto-check score</h3>
  <p class="muted">${exam.scope==='all'?'Full Year Exam':esc(exam.scope+' Exam')} • 60 minutes • 52 questions</p>
  <h3>Section Marks</h3>
  <div class="unit-grid">
   <div class="lesson-card"><b>20 MCQ</b><br>${section.mc}/20</div>
   <div class="lesson-card"><b>10 Fill</b><br>${section.fill}/10</div>
   <div class="lesson-card"><b>10 Matching</b><br>${section.match}/10</div>
   <div class="lesson-card"><b>10 Short</b><br>${section.short}/10</div>
   <div class="lesson-card"><b>2 Long</b><br>${section.long}/10</div>
   <div class="lesson-card"><b>Total</b><br>${score}/${max}</div>
  </div>
  <h3>Review Mistakes</h3>${mistakeHtml}
  <h3>Long-Answer Review</h3>${longHtml}
  <button class="gold" onclick="endExamAndReturn()">Return to Study Hub</button>
 </div>`;
}

function endExamAndReturn(){
 document.body.classList.remove('exam-fs-active');
 removeExamBadge();
 go('home');
}

function renderExam(){
 const title=exam.scope==='all'?'Full Year Exam':esc(exam.scope+' Exam');
 shell(`<section class="panel" id="examArea">
  <div class="exam-head"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
   <div><span class="badge">Exam Mode</span><h2>${title}</h2><small class="muted">52 questions • 60 minutes • 60 marks</small></div>
   <div><div class="timer" id="timer">60:00</div><small style="display:block;text-align:center;margin-top:4px;font-size:11px;color:var(--muted)">remaining</small></div>
  </div><div class="progress" style="margin-top:12px"><i id="examProgress" style="width:100%"></i></div>
  <div class="warn">🔒 Security mode: Escape, right-click, copy/paste, common refresh/navigation shortcuts, tab switching and leaving full-screen are blocked or treated as violations. A real web page cannot guarantee absolute anti-cheating, but these browser-level deterrents are enabled.</div></div>

  <div class="exam-section"><h3>Part A — 20 Multiple Choice Questions</h3>${exam.mc.map((q,i)=>`<div class="exam-q"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="mc${i}" onchange="answer('mc${i}',${j})"> <span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}</div>
  <div class="exam-section"><h3>Part B — 10 Fill in the Blank</h3>${exam.fill.map((q,i)=>`<div class="exam-q"><b>${i+1}. ${esc(q.q)}</b><input class="fill" oninput="answer('fill${i}',this.value)" placeholder="Type your answer" autocomplete="off" spellcheck="false"></div>`).join('')}</div>
  <div class="exam-section"><h3>Part C — 10 Matching</h3><p class="muted">Match each term with the correct definition.</p>${exam.match.map((q,i)=>`<div class="exam-q"><div class="match"><b>${i+1}. ${esc(q.term)}</b><select onchange="answer('match${i}',this.value)"><option value="">Select definition…</option>${exam.right.map((d,j)=>`<option value="${j}">${esc(d)}</option>`).join('')}</select></div></div>`).join('')}</div>
  <div class="exam-section"><h3>Part D — 10 Short Questions</h3>${exam.short.map((q,i)=>`<div class="exam-q"><b>${i+1}. ${esc(q.q)}</b><input class="fill" oninput="answer('short${i}',this.value)" placeholder="Write the key term" autocomplete="off" spellcheck="false"></div>`).join('')}</div>
  <div class="exam-section"><h3>Part E — 2 Long Questions</h3>${exam.long.map((q,i)=>`<div class="exam-q"><b>${i+1}. ${esc(q.q)}</b><textarea class="fill" oninput="answer('long${i}',this.value)" placeholder="Write a detailed answer..." spellcheck="false"></textarea></div>`).join('')}</div>
  <button class="gold" style="width:100%;padding:16px;font-size:16px;margin-top:20px" onclick="if(confirm('Submit the exam now?'))submitExam(false)">Submit Exam</button>
 </section>
 <div id="fsOverlay" class="fs-overlay hidden"><div class="fs-box"><h2>🔒 Full-Screen Exam Required</h2><p>Click the button below to request browser full-screen and start the 60-minute timer. Do not press Escape or leave the exam window.</p><button onclick="enterExamFullscreen()">⛶ Enter Fullscreen &amp; Start Exam</button></div></div>`);
}

document.addEventListener('keydown',e=>{
 if(view!=='exam'||!examStarted||examSubmitted)return;
 const k=e.key.toLowerCase();
 const bad=e.key==='Escape'||e.key==='F5'||e.key==='F11'||e.key==='F12'||
  (e.ctrlKey&&['r','w','t','l','u','c','v','x','s','p','a','f'].includes(k))||
  (e.metaKey&&['r','w','t','l','u','c','v','x','s','p','a','f'].includes(k))||
  (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k));
 if(bad){
  e.preventDefault();e.stopPropagation();
  violationCount++;exam.violations=violationCount;
  alert(`Security warning ${violationCount}/3: this action is not allowed during the exam.`);
  if(violationCount>=3)submitExam(true);
 }
},true);
document.addEventListener('visibilitychange',()=>{
 if(view==='exam'&&examStarted&&!examSubmitted&&document.hidden){
  violationCount++;exam.violations=violationCount;
  if(violationCount>=3)submitExam(true);
  else alert(`Security warning ${violationCount}/3: leaving the exam window is not allowed.`);
 }
});
document.addEventListener('fullscreenchange',()=>{
 if(view==='exam'&&examStarted&&!examSubmitted&&!document.fullscreenElement){
  violationCount++;exam.violations=violationCount;
  if(violationCount>=3)submitExam(true);
  else alert(`Security warning ${violationCount}/3: Full-screen mode was exited.`);
 }
});
document.addEventListener('contextmenu',e=>{if(view==='exam'&&examStarted&&!examSubmitted)e.preventDefault()});
document.addEventListener('copy',e=>{if(view==='exam'&&examStarted&&!examSubmitted)e.preventDefault()});
document.addEventListener('cut',e=>{if(view==='exam'&&examStarted&&!examSubmitted)e.preventDefault()});
document.addEventListener('paste',e=>{if(view==='exam'&&examStarted&&!examSubmitted)e.preventDefault()});
window.addEventListener('beforeunload',e=>{
 if(view==='exam'&&examStarted&&!examSubmitted){e.preventDefault();e.returnValue='Exam in progress';}
});
renderHome();
</script>
